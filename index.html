:744" data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:745" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:746" data-name="Ornament 19"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:747" data-name="Ornament 20"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:748" data-name="Ornament 21"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:749" data-name="Ornament 22"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:750" data-name="Ornament 23"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:751" data-name="Ornament 24"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="392:752" data-name="Ornament 25"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div></div></div></div><div class="s469fb6c3f5" data-node-id="392:771" data-name="image 8" data-page-background=""><div class="sfb97e384f1"><img alt="" class="sf379a32222" src="assets/gift-background.webp" draggable="false" decoding="async" width="1920" height="1078"></div></div><div class="s2795757921" data-node-id="392:774"><div class="se3fba8fcc9" data-node-id="392:775"><p class="s9df0158fe5">Знакомы?))<br aria-hidden>я обещала подарок, но тут чуть-чуть тут микрообман произошел (можешь зафиксировать припоминать потом)</p><p class="s350e5afd21">подарок и так к тебе приехал, радуйся что продолжает приезжать))</p></div></div><div class="s475d11a3dc" data-node-id="451:37"><div class="see4617093c" data-node-id="451:38"><p class="s9df0158fe5">С днем рождения тебя❤️</p><p class="s9df0158fe5">​</p><p class="s9df0158fe5">Я за все время нашего знакомства имела честь наблюдать очень разные версии тебя. В разных состояниях, при различных внешних обстоятельствах, с меняющимися целями, переживаниями и сложностями. И во всех них, по моим наблюдениям, у тебя клёво всё выходит по итогу. Через тернии или через непростые ситуации, но как будто разруливается, чем можно смело гордиться. </p><p class="s9df0158fe5">Я желаю тебе продолжать искусно лавировать между проблемами и подводными камнями и получать удовольствие от всего что ты делаешь. </p><p class="s350e5afd21">Не подпускать слишком близко идиотов (на безопасном расстоянии они даже полезны), но окружать себя умными и интересными людьми. </p></div></div><div class="sa34abe1297" data-node-id="451:39"><div class="sd07794a584" data-node-id="451:40"><p class="s9df0158fe5">Желаю не погрязать в рутине, критически наблюдать за собой со стороны, идти к целям, даже если они пока что кажутся очень далекими (дом с роялем сам себя не построит, гхм). </p><p class="s9df0158fe5">Визуализировать все, что ты хочешь чтобы у тебя было!</p><p class="s9df0158fe5">Не болеть и не трястись без причин</p><p class="s9df0158fe5">Много летать в насыщенные и интересные трипы (или наоборот в максимально скучные, это тоже важный тип поездок)</p><p class="s9df0158fe5">Спонтанности! В меру конечно, но если умные люди говорят надо завтра лететь на Мальдивы - значит надо завтра лететь на Мальдивы :)</p><p class="s9df0158fe5">Любви - к себе, к миру вокруг и к дорогим тебе людям</p><p class="s9df0158fe5">Настойчивости и терпимости</p><p class="s9df0158fe5">И 9,5 часов сна каждый день</p><p class="s9df0158fe5">​</p><p class="s0fe362c03f" data-bold="">Поздравляю тебя!</p></div></div><a class="sc4f40f7e17" data-node-id="395:785" href="#/home"><p class="sa4cb2d5392" data-node-id="395:786">Все, на главную</p></a><div class="sfc768c80ba" data-node-id="451:47"><p class="s9df0158fe5">Данных этих мне так и не было выдано, btw...</p><p class="s350e5afd21">мутная история</p></div><div class="s28431aec6f" data-node-id="451:48"><div class="sb26d65add2"><div class="s406897d24e" data-name="telegram-cloud-photo-size-2-5343625218666210535-y 1"><img alt="" class="sb440a5c4af" src="assets/gift-oct6.webp" draggable="false" decoding="async" width="1170" height="1141"></div></div></div></div></template><template id="screen-welcome"><div class="see38320a5a screen" data-node-id="194:6526" data-name="Главная" data-screen="welcome"><div class="s93a9fc9920" data-node-id="194:6527" data-canvas-background=""><div class="sdfd8d95429" data-node-id="194:6528" data-name="bg"></div><div class="saf245690f8" data-node-id="194:6529"><div class="s6e2e058af1" data-node-id="194:6530"><div class="s071780bfe4" data-node-id="194:6531" data-name="Ornament 15"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6532" data-name="Ornament 16"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6533" data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6534" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6535" data-name="Ornament 19"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="  data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6606" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6607" data-name="Ornament 19"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6608" data-name="Ornament 20"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6609" data-name="Ornament 21"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6610" data-name="Ornament 22"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6611" data-name="Ornament 23"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6612" data-name="Ornament 24"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="194:6613" data-name="Ornament 25"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div></div></div></div><p class="s481be3fa52" data-node-id="194:6645">все данные собраны независимыми наблюдателями и носят 100% правдивый характер (или нет)</p><div class="s6b949524a9" data-node-id="204:6654"><p class="s6f840b89de" data-node-id="204:6655" data-bold="" data-italic="">Привет!</p><div class="s2ace177c6a" data-node-id="194:6647"><p class="s9df0158fe5">В жизни каждого человека рано или поздно наступает момент, когда ему исполняется 30.</p><p class="s9df0158fe5">Скорее всего эта мысль поначалу вызывает страх и ужас, желание завести странное хобби, злиться на всех кто зовет тебя старым и отрицать факт неизбежности того, что ты </p><p class="s350e5afd21">реально взрослый</p></div><p class="sf417a015da" data-node-id="194:6648"><span class="s350e5afd21">В этот момент очень важно </span><span class="sc78fa2ba38" data-italic="">не останавливать себя</span><span class="s350e5afd21">, почувствовать все эти эмоции, подумать эти дурацкие мысли, выписать список ЧТО Я ЕЩЕ НЕ ПОНЯЛ К 30 ГОДАМ, признать какой-то там кризис, завести то самое странное хобби, нашипеть на всех кто посмел назвать тебя старым - а затем вспомнить, как много классного в тебе есть и как много всего уже получилось построить. И подумать о том, что еще есть целая жизнь чтобы воплотить все то, что сидит в голове пока что мечтами или целями.</span></p><div class="s58be58e04d" data-node-id="194:6652" data-italic=""><p class="saeddf40ec1" data-bold="" data-italic="">Так вот</p><p class="s350e5afd21">хочется помочь тебе увидеть себя со стороны, потому что мы все - видим классного, интересного, заряженного парня, полного энергии, желания творить, с прекрасным чувством юмора, в меру упертого, целеустремленного и местами даже ленивого)</p></div></div><a class="s76cc89f3e8" data-node-id="194:6650" href="#/home"><p class="s6690744ef8" data-node-id="194:6651">что же там</p></a></div></template><template id="screen-intro"><div class="see38320a5a screen" data-node-id="32:1828" data-name="Главная" data-screen="intro"><div class="s0e2510d3fa" data-node-id="39:4370" data-canvas-background=""><div class="s23f8759428" data-node-id="39:4371" data-name="bg"></div><div class="s9d1ad7013d" data-node-id="39:4372"><div class="s6e2e058af1" data-node-id="39:4373"><div class="s071780bfe4" data-node-id="39:4374" data-name="Ornament 15"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggabl точно знаем, что этот час в баре станет лучшими тремя часами жизни, а эту пятичасовую встречу вы будете вспоминать еще долго</p></div><div class="sd7150101ae" data-node-id="39:4991" data-name="Image 20"><div aria-hidden class="seaa8c15132"><div class="s83a6897ae2"></div><div class="s0a915fb657"><img alt="" class="s3407971055" src="assets/b66f01088743875944f7.webp" draggable="false" decoding="async" width="1201" height="1600"></div></div></div></div><div class="s82a27e81c4" data-node-id="46:5126"><div class="s85fd0db94d" data-node-id="410:839"><p class="sb4e5d18727" data-node-id="410:840">Чтобы никто не ставил тебе подобных ультиматумов. Ибо все мы знаем, что только пиво тебя никогда не предаст!</p></div><div class="sd9ea6126e4" data-node-id="39:5009" data-name="Image 39"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/686871947fbd40b07a24.webp" draggable="false" decoding="async" width="1179" height="378"></div></div></div><div class="sae7a2a32ff" data-node-id="39:5099" data-name="IMG_0847 1"><img alt="" class="sb440a5c4af" src="assets/dc4d569c157249c0afb8.webp" draggable="false" decoding="async" width="1206" height="516"></div><a class="s8826a1b2c4" data-node-id="39:5102" href="#/home"><p class="s6690744ef8" data-node-id="39:5103">Назад</p></a><div class="sdad2a5a5ae" data-node-id="65:5781"><div class="sa83d2a6fe7" data-node-id="39:5006" data-name="Image 25"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/134f658aa3306ad54975.webp" draggable="false" decoding="async" width="1245" height="1600"></div></div><p class="s391e1add0a" data-node-id="49:5136">Чтобы на любой тусовке всегда было твое любимое пиво</p><div class="sf04a823030" data-node-id="8:12" data-name="Image 6"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/b3ddd454b13bb50bdaa3.webp" draggable="false" decoding="async" width="1276" height="903"></div></div></div><div class="s5e8b18b3d6" data-node-id="66:5784"><p class="sb836596b0c" data-node-id="65:5783">Этот взгляд...</p><div class="s52046efa6f" data-node-id="61:5773" data-name="IMG_8021 1"><img alt="" class="sb440a5c4af" src="assets/62830ad0819cc8d3463a.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="s36d78be133" data-node-id="410:837"><div class="se3fba8fcc9" data-node-id="410:838"><p class="s16a4c4d308" data-bold="">По пивку?</p><p class="sf5c4d1471a">Желаю, чтобы этот прекрасный напиток оставался твоим островком спокойствия, душевного равновесия и стабильного счастья.</p><p class="s32bd4c7660">Чтобы даже нулевка (в те вечера когда ты выбираешь ЗОЖ) доставляла тебе массу удовольствия!</p></div></div></div></template><template id="screen-friends"><div class="see38320a5a screen" data-node-id="60:5643" data-name="ДРУЗЬЯ" data-screen="friends"><div class="s9d8ab2fad0" data-node-id="60:5644" data-canvas-background=""><div class="sdfd8d95429" data-node-id="60:5645" data-name="bg"></div><div class="saf245690f8" data-node-id="60:5646"><div class="s6e2e058af1" data-node-id="60:5647"><div class="s071780bfe4" data-node-id="60:5648" data-name="Ornament 15"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5649" data-name="Ornament 16"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5650" data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5651" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5652" data-name="Ornament 19"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="6 26a1b2c4" data-node-id="60:5747" href="#/home"><p class="s6690744ef8" data-node-id="60:5748">Назад</p></a><div class="sc2a67541fd" data-node-id="8:23" data-name="Image 16"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/d535c0bdd113f4265213.webp" draggable="false" decoding="async" width="384" height="204"></div></div><div class="sb4d274bd96" data-node-id="8:39" data-name="Image 31"><div class="s2567c04302"><img alt="" class="sfa51084cf2" src="assets/05c627dc811d28b68687.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="s09ff1b4bab" data-node-id="61:5769" data-name="IMG_1045 1"><div class="s2567c04302"><img alt="" class="s591718e856" src="assets/14b6199ae738d474ca04.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="sb68f6c767e" data-node-id="61:5770" data-name="Image 33"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/f8e0c70d3c0db877194b.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="s8b895d9571" data-node-id="61:5772" data-name="IMG_0224 1"><img alt="" class="sb440a5c4af" src="assets/0ec6d3d6d52822d22f5b.webp" draggable="false" decoding="async" width="1200" height="1600"></div><div class="s86a22ffa65" data-node-id="62:5775" data-name="IMG_8107 1"><div class="s2567c04302"><img alt="" class="sd2ddea1899" src="assets/95a2f4ab7759b4de0b1f.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="s55cc5e4789" data-node-id="62:5777"><div class="s37bd659ce5" data-node-id="62:5778"><p class="s5a4fd449fe"><span class="s350e5afd21">Мне кажется, я еще не встречала человека, у которого было бы ТАК много </span><span class="s1b2032ee38" data-strike="">фанатов</span><span class="s350e5afd21"> друзей. </span></p><p class="s9df0158fe5">Это невероятная поддержка, источник мемов, разнообразных и смешных историй, бесконечного пула активностей и внезапных планов. Каждый человек в твоем окружении ценен и важен по-своему, и хочется пожелать наверное, чтобы эта дружеская опора никогда не трескалась, не шаталась и с годами дальше только укреплялась. Это очень ценно, когда всегда есть с кем пошутить, с кем помолчать, кому позвонить, с кем обсудить глубокое (или плоское) или кому занять полляма. Береги это и пусть тебе всегда на всё и на всех хватает энергии!</p><p class="s350e5afd21">И не забывай про интровертов, иногда попадающихся тебе на глаза :)</p></div></div><div class="s4be4dc9af3" data-node-id="62:5774" data-name="IMG_1046 1"><div class="s2567c04302"><img alt="" class="s4f995199f3" src="assets/c1742000deff17a81a39.webp" draggable="false" decoding="async" width="1201" height="1600"></div></div><div class="sa4712f7128" data-node-id="60:5767"><p class="s4cfd34f637" data-node-id="60:5768" data-bold="">Найдите фото на котором Саша не обнимается с друзьями</p></div><div class="s121c3bbcda" data-node-id="35:2129" data-name="IMG_0986 1"><img alt="" class="sb440a5c4af" src="assets/c45774e19369adde6fd6.webp" draggable="false" decoding="async" width="1280" height="725"></div><div class="s47304482b0" data-node-id="74:6487"><div class="s7113332ff2"><p class="s94fd7d43e3" data-italic="">обоюдно</p></div></div><div class="s21f7722c80" data-node-id="392:656"><div class="s7113332ff2"><p class="s94fd7d43e3" data-italic="">по пивку?</p></div></div><div class="sdce508732c" data-node-id="392:657"><div class="s4a76e7c2c7"><div class="s1424c5bc41" data-italic=""><p class="sf5c4d1471a">Я?? - нееет</p><p class="s32bd4c7660">мы?? - даааа</p></div></div></div></div></template><template id="screen-sport"><div class="see38320a5a screen" data-node-id="60:5427" data-name="СПОРТ" data-screen="sport"><div class="s9d8ab2fad0" data-node-id="60:5428" data-canvas-background=""><div class="sdfd8d95429" data-node-id="60:5429" data-name="bg"></div><div class="saf245690f8" data-node-id="60:5430"><div class="s6e2e058af1" data-node-id="60:5431"><div class="s071780bfe4" data-node-id=" nc"></div><div class="s071780bfe4" data-node-id="60:5513" data-name="Ornament 24"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5514" data-name="Ornament 25"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div></div></div></div><div class="sa9ff726749" data-node-id="60:5515"><p class="sfe605607e8" data-node-id="60:5516">Спорт</p></div><p class="s1556bba0ba" data-node-id="60:5517">Территория дорогих стелек, no-look ударов в паделе и футбола</p><a class="s8826a1b2c4" data-node-id="60:5531" href="#/home"><p class="s6690744ef8" data-node-id="60:5532">Назад</p></a><div class="s409a59d4b7" data-node-id="60:5545" data-name="фото"><p class="s0116d0eaa7" data-node-id="60:5544">НУ ОН</p><div class="s47de76dfa5" data-node-id="35:2125" data-name="IMG_0990 1"><img alt="" class="sb440a5c4af" src="assets/5d19ba82764fc883eec7.webp" draggable="false" decoding="async" width="960" height="1280"></div></div><div class="s4566ae9a31" data-node-id="70:6470"><div class="sa54e5a955f"><div class="s22cacd710c" data-name="Image 39"><div class="s2567c04302"><img alt="" class="s4cc6107cb3" src="assets/109e9531c40f4845b271.webp" draggable="false" decoding="async" width="458" height="766"></div></div></div></div><div class="s16e3d32ace" data-node-id="35:2130" data-name="IMG_0984 1"><img alt="" class="sb440a5c4af" src="assets/9a4cf098cb2421019205.webp" draggable="false" decoding="async" width="1201" height="1600"></div><div class="sf2f1cb315e" data-node-id="70:6483"><div class="s37bd659ce5" data-node-id="70:6484"><p class="s9df0158fe5">Минусы?  Неет. Остановит ли это Сашу? Неет.</p><p class="s350e5afd21">Спорт - это неотъемлемая часть тебя, твоих увлечений и активностей. Способ сбросить стресс, способ отдохнуть, выкинуть накопившуюся усталость и получить массу удовольствия, даже если удары летят в аут, в сетку или соседний корт</p></div></div><div class="sd957e4696a" data-node-id="70:6472" data-name="Image 41"><div class="s2567c04302"><img alt="" class="sd8684d3a47" src="assets/0740233302c3e0f7a370.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="sddbbd57b74" data-node-id="70:6482"><div class="sdf0a3de519" data-node-id="175:6495"><div class="se17fdee951"><img alt="" class="sacc3667e96" src="assets/sport-line.svg" draggable="false" decoding="async"></div></div><p class="sd6fa6095c2" data-node-id="70:6476">футбол только на воротах</p><p class="sc023546383" data-node-id="70:6474">волна в 10 утра (успешно проспана)</p><p class="sd6fa6095c2" data-node-id="70:6475">стельки 20тыщ стоят</p><p class="sd6fa6095c2" data-node-id="70:6477">в падел четвертого искать</p><p class="sd6fa6095c2" data-node-id="70:6478">фэнтези футбольное — тряска</p><p class="sc023546383" data-node-id="70:6485">тренер требует есть белок и креатин</p><p class="sc1b2084f05" data-node-id="175:6491">тренерша по теннису бросается мячиками и газлайтит</p><div class="sdf0a3de519" data-node-id="175:6497"><div class="se17fdee951"><img alt="" class="sacc3667e96" src="assets/sport-line.svg" draggable="false" decoding="async"></div></div></div><div class="s45a5f33296" data-node-id="175:6493"><div class="se3fba8fcc9" data-node-id="175:6494"><p class="s9df0158fe5">Пусть нога тебя никогда не беспокоит, пусть все удары получаются без фейлов, пусть турики по теннису всегда приносят тебе только золотые медали (или опыт). И пусть Макс тебя продолжает гонять по залу интенсивными тренировками.</p><p class="s350e5afd21">Пробуй новое, продолжай старое, и желаю чтобы футбол потихоньку вернулся в твою жизнь не только в виде стояния на воротах!</p><p class="s350e5afd21">Тебе очень идет спорт, причем как будто бы любой. Очень вдохновляет активничать больше! Ну и любоваться тобой :)</p></div></div><div class="s7ab8f8f200" data-node-id="177:6502" data-name="image 1"><div class="s2567c04302"><img alt="" class="sb7d8ef0c74" src="assets/492cae80fcf3779a0195.webp" draggable="false" decoding="async" width="1200" height="1600"></div></div><div class="s0354c56e68" data-node-id="177:6506" data-name="image 2"><img alt="" class="sb440a5c4af" src="assets/a574920720bff96e7f76.webp" draggable="false" decoding="async" width="1200" height="1600"></div><div class="s05b8490de3" data-node-id="194:6517" data-name="image 5"><img alt="" class="sb440a5c4af" src="assets/9b8e13e359c1032042a8.webp" draggable="false" decoding="async" width="1107" height="1600"></div><div class="s4bdf188814" data-node-id="194:6522" data-name="Screenshot 2026-09-24 at 22.10.35 1"><div class="s2567c04302"><img alt="" class="s9f441407f6" src="assets/7b78d0cb42177d159a90.webp" draggable="false" decoding="async" width="918" height="1600"></div></div></div></template><template id="screen-games"><div class="see38320a5a screen" data-node-id="60:5546" data-name="ИГРЫ" data-screen="games"><div class="s9d8ab2fad0" data-node-id="60:5547" data-canvas-background=""><div class="sdfd8d95429" data-node-id="60:5548" data-name="bg"></div><div class="saf245690f8" data-node-id="60:5549"><div class="s6e2e058af1" data-node-id="60:5550"><div class="s071780bfe4" data-node-id="60:5551" data-name="Ornament 15"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5552" data-name="Ornament 16"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5553" data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5554" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="60:5555" data-name="Ornament 19"><img alt="" class="s lass="sfb97e384f1"><img alt="" class="se7243bda23" src="assets/b036d380f902d2b3a37d.webp" draggable="false" decoding="async" width="1206" height="821"></div></div><div class="s9d388ea392" data-node-id="420:7"><div class="sb07d0f6e92" data-node-id="420:9" data-name="IMG_0980 1"><div class="sfb97e384f1"><img alt="" class="s5317b5c26c" src="assets/e493c88cfd36f79aea76.webp" draggable="false" decoding="async" width="1206" height="258"></div></div><p class="s594cff0a7c" data-node-id="420:8">Девиз доты</p></div><div class="sc41fd65b80" data-node-id="450:17"><div class="s23ba7cb1f5" data-node-id="450:20" data-name="IMG_0976 1"><div class="s2567c04302"><img alt="" class="sf566037ecb" src="assets/8635f36678f15c8a2a77.webp" draggable="false" decoding="async" width="1206" height="1483"></div></div><p class="s594cff0a7c" data-node-id="450:19">Девиз шахмат</p></div><div class="s40aa7af1a8" data-node-id="450:13"><p class="s64e848e86e" data-node-id="420:11">конечно плохая</p><div class="s4be8e16f4a" data-node-id="35:2132" data-name="IMG_0981 1"><div class="s2567c04302"><img alt="" class="s494f432479" src="assets/ede15f7557e6191b490a.webp" draggable="false" decoding="async" width="736" height="1600"></div></div></div><div class="s9897c41b54" data-node-id="451:33" data-name="telegram-cloud-photo-size-2-5343625218666210488-y 1"><div class="s2567c04302"><img alt="" class="sc3464deb67" src="assets/games-oct6.webp" draggable="false" decoding="async" width="720" height="1280"></div></div><div class="sa0803b9da1" data-node-id="450:15"><div class="s37bd659ce5" data-node-id="450:16"><p class="s9df0158fe5">Щас бы три часа рубиться в доту, материться на всех, проигрывать, отыгрываться, сраться с теми, кто плохо играет и тратить все нервы. А потом выходить и говорить “как же классно, отдохнул вообще!”</p><p class="s9df0158fe5">​</p><p class="s9df0158fe5">Понимать это не нужно, нужно просто наслаждаться тем, что тебе есть как отдохнуть, что бы этот отдых не представлял из себя)</p><p class="s9df0158fe5">​</p><p class="s350e5afd21">В цивилизации мы желаем культурных побед! Военных только если они первые начали. </p></div></div><div class="sb361320b36" data-node-id="450:22"><p class="s3ae2a0aa5f" data-node-id="450:23">Желаю чтобы в шахматах количество зевков не превышало количества побед. Чтобы конь ходил куда надо, соперники играли так, как ты и задумал, дебюты учились и шахматные задачки щелкались</p></div><div class="s1fdfb1d32d" data-node-id="451:35"><div class="s37bd659ce5" data-node-id="451:36"><p class="s9df0158fe5">В целом еще есть фифа, большой теннис на плойке, it takes two, морской бой, го, шашки и нарды. Круто то, что с тобой можно поиграть во всё! Поиграть чилльно, поучиться, расслабиться, помучиться в теннисе, подумать в шахматах. </p><p class="s350e5afd21">А увлеченность интеллектуальными играми еще и kinda hot :)</p></div></div></div></template><template id="screen-work"><div class="see38320a5a screen" data-node-id="49:5140" data-name="РАБОТА" data-screen="work"><div class="s9d8ab2fad0" data-node-id="49:5141" data-canvas-background=""><div class="sdfd8d95429" data-node-id="49:5142" data-name="bg"></div><div class="saf245690f8" data-node-id="49:5143"><div class="s6e2e058af1" data-node-id="49:5144"><div class="s071780bfe4" data-node-id="49:5145" data-name="Ornament 15"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="49:5146" data-name="Ornament 16"><img alt="" class="s8faf267d30" src="assets/85e62bf0ca851602912e.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="49:5147" data-name="Ornament 17"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="49:5148" data-name="Ornament 18"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" da :5261"><div class="se30a5bb17a" data-node-id="49:5242"><div class="seab6aa73b4"><p class="s89fc2d034e" data-italic=""><span class="saaccccb0b8" data-strike="">контора</span><span class="s32bd4c7660"> п*дарасов</span></p></div></div><div class="s09c254a23f" data-node-id="49:5260"><div class="seab6aa73b4"><p class="sd292182fad" data-italic="">экосистема</p></div></div></div><a class="s8826a1b2c4" data-node-id="49:5244" href="#/home"><p class="s6690744ef8" data-node-id="49:5245">Назад</p></a><div class="s315e9b48e5" data-node-id="51:5366"><div class="s1556270d13"><p class="sb40ea394b8" data-italic="">От меня сейчас что требуется?</p></div></div><div class="sb02eb1b4b3" data-node-id="49:5262" data-name="Image 40"><div aria-hidden class="seaa8c15132"><div class="s83a6897ae2"></div><div class="s0a915fb657"><img alt="" class="s3407971055" src="assets/704ffffb4c79cfbb2775.webp" draggable="false" decoding="async" width="720" height="545"></div></div></div><div class="s93c5acb566" data-node-id="35:2126" data-name="IMG_0989 1"><img alt="" class="sb440a5c4af" src="assets/4d475a7518a1465c12ae.webp" draggable="false" decoding="async" width="1280" height="676"></div><div class="sb7228348f4" data-node-id="51:5264" data-name="IMG_0987 1"><div class="s2567c04302"><img alt="" class="s891ea1bb90" src="assets/c5280bb534da67989b07.webp" draggable="false" decoding="async" width="822" height="614"></div></div><div class="s57c5a96e6e" data-node-id="8:30" data-name="Image 22"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/e819f9629c85018b24b7.webp" draggable="false" decoding="async" width="1206" height="674"></div></div><div class="s21def7d205" data-node-id="8:32" data-name="Image 24"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/76c76e84090dd3beef42.webp" draggable="false" decoding="async" width="1206" height="1094"></div></div><div class="s0fb8b0af72" data-node-id="8:17" data-name="Image 11"><div class="s2567c04302"><img alt="" class="s3407971055" src="assets/cf93660fd1cb3d67a3e5.webp" draggable="false" decoding="async" width="1170" height="903"></div></div><div class="s65e1e9bff4" data-node-id="51:5418"><div class="s37bd659ce5" data-node-id="51:5419"><p class="s5a4fd449fe"><span class="sa93d84c3b1" data-bold="">В работе главное то, что она приносит тебе удовольствие.</span><span class="s350e5afd21"> В каких параметрах это удовольствие у тебя выражается - решать тебе :). Сегодня это классный проект, завтра сырки в офисе, а в другой день то самое классное ощущение того, что ты делаешь что-то стоящее, полезное для школьников и образования, что-то смелое и интересное.</span></p><p class="s9df0158fe5">А иногда всё удовольствие в террасе и падел кортах от вашей лучшей конторы - 100% понимания, вы эти виды с террас и из сити видели вообще...</p><p class="s32bd4c7660">И в этом и есть как будто вся суть хорошей работы, которая мотивирует тебя делать еще больше, лучше, развиваться, придумывать новое и не сидеть на месте!</p></div></div><div class="s0c3a54c06b" data-node-id="51:5421"><div class="s4eb2a19a41" data-node-id="51:5422"><p class="sa6fe168879" data-bold="">Здесь мы желаем </p><ul class="s1f33b438c8"><li class="s642832b72d"><span class="s32bd4c7660">классных проектов!</span></li><li class="s642832b72d"><span class="s32bd4c7660">новых идей, которые хочется воплощать в жизнь</span></li><li class="s642832b72d"><span class="s32bd4c7660">нескончаемых токенов</span></li><li class="s642832b72d"><span class="s32bd4c7660">умного и понятливого клода (а не как обычно)</span></li><li class="s642832b72d"><span class="s32bd4c7660">никаких Олегов</span></li><li class="s642832b72d"><span class="s32bd4c7660">прайм дней, когда таски закрываются, работа делается и заряженность на максимум</span></li><li class="s1813ac086d"><span class="s32bd4c7660">и чтобы работы было мало, а денег много!</span></li></ul></div></div><div class="s7e1253e7ab" data-node-id="392:654"><div class="s873a6d5c14"><div class="s6fd95f5459" data-name="te sets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="51:5348" data-name="Ornament 21"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="51:5349" data-name="Ornament 22"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="51:5350" data-name="Ornament 23"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="51:5351" data-name="Ornament 24"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div><div class="s071780bfe4" data-node-id="51:5352" data-name="Ornament 25"><img alt="" class="s8faf267d30" src="assets/5c6adde0b3313f43e219.svg" draggable="false" decoding="async"></div></div></div></div><div class="s5ff254a028" data-node-id="51:5353"><p class="sfe605607e8" data-node-id="51:5354">О тебе</p></div><p class="s82df6de44d" data-node-id="51:5355">Территория любви к себе</p><div class="s38bed54c6f" data-node-id="51:5416"><p class="se3fba8fcc9" data-node-id="51:5413"><span class="s32bd4c7660">В тебе умещается какой-то миллиард всяких разных активностей, энергии, дел, шуток, идей (</span><span class="s3726dfb0ce" data-italic="" data-strike="">и пива</span><span class="s32bd4c7660">). И в целом со стороны кажется, что жизнь твоя двигается в каком-то правильном направлении. Потому хочется пожелать тебе тех вещей, которые помогут не сбиваться в этого направления, в нужный момент его корректировать, ускоряться (а иногда и замедляться) и просто позволят тебе жить эту жизнь как ты пожелаешь!</span></p></div><div class="s6c85843635" data-node-id="394:781"><p class="sb4e5d18727" data-node-id="394:782">Люби себя самого за то разнообразие интересов, мыслей и мнений, которое в тебе ж
